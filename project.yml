name: ShutYourMouth

options:
  bundleIdPrefix: com.andrieiev
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  ShutYourMouth:
    type: application
    platform: macOS
    sources:
      - path: ShutYourMouth
        excludes:
          - "**/*.md"
    info:
      path: ShutYourMouth/Info.plist
      properties:
        CFBundleDisplayName: "Shut Your Mouth"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: "Shut Your Mouth optionally displays which app is currently using your microphone. Microphone access is not required for the core mute/unmute functionality."
        NSHumanReadableCopyright: "© 2026 Andrii Andrieiev"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrieiev.shutyourmouth
        PRODUCT_NAME: ShutYourMouth
        PRODUCT_MODULE_NAME: ShutYourMouth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
